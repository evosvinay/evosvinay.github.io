<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinay - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        p.tagline {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .bio {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Vinay</h1>
        <p class="tagline">Developer & Tech Enthusiast</p>
        <p class="bio">
            Welcome to my official portfolio! I am passionate about building modern web applications and exploring new technologies.
        </p>
        <a href="mailto:evosvinay@gmail.com" class="btn">Contact Me</a>
    </div>

</body>
</html>
